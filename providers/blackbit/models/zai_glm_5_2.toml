# Pricing and output cap from GET https://void.blackbit.sh/v1/models (accessed 2026-09-22).
# https://docs.blackbit.sh/docs/void/models/language
# Effort: reasoning_effort = high|max. low|medium collapse to high; xhigh maps to max.
# https://docs.z.ai/api-reference/llm/chat-completion (accessed 2026-09-22)
base_model = "zhipuai/glm-5.2"

[[reasoning_options]]
type = "effort"
values = ["high", "max"]

[cost]
input = 0.80
output = 2.55

[limit]
output = 128_000
