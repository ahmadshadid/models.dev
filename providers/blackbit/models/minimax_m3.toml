# Pricing, limits, and modalities from GET https://void.blackbit.sh/v1/models (accessed 2026-09-22).
# https://docs.blackbit.sh/docs/void/models/language
# Live catalog accepts text, image, and pdf. Lab entry lists video instead of pdf.
# Effort: reasoning_effort = low|medium|high. Omit to keep the model default.
# https://docs.blackbit.sh/docs/void/integrations/response-anatomy (accessed 2026-09-22)
# cache_read = input * model_info.cache_read_multiplier (0.2).
base_model = "minimax/MiniMax-M3"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.3
output = 1.2
cache_read = 0.06

[limit]
context = 1_000_000
output = 1_000_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]
