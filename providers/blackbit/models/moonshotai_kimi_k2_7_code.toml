# Pricing, limits, and modalities from GET https://void.blackbit.sh/v1/models (accessed 2026-09-22).
# https://docs.blackbit.sh/docs/void/models/language
# Live catalog accepts text and image. Lab entry also lists video.
# Moonshot authors no caller control for Kimi K2.7 Code.
# VOID does not document a checkpoint-specific effort enum, so none is copied.
base_model = "moonshotai/kimi-k2.7-code"
reasoning_options = []

[cost]
input = 0.95
output = 4.00

[limit]
context = 256_000
output = 32_768

[modalities]
input = ["text", "image"]
