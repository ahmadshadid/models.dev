# Pricing, limits, and modalities from GET https://void.blackbit.sh/v1/models (accessed 2026-09-22).
# https://docs.blackbit.sh/docs/void/models/language
# Live catalog accepts text and image. Lab entry also lists video.
# First-party control is a thinking toggle, which VOID does not document.
# VOID's published caller field is reasoning_effort = low|medium|high.
# https://docs.blackbit.sh/docs/void/integrations/response-anatomy (accessed 2026-09-22)
base_model = "moonshotai/kimi-k2.6"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 0.95
output = 4.00

[limit]
context = 262_000
output = 262_000

[modalities]
input = ["text", "image"]
