# Pricing, output cap, and modalities from GET https://void.blackbit.sh/v1/models (accessed 2026-09-22).
# https://docs.blackbit.sh/docs/void/models/language
# Live catalog accepts text and image. Lab entry also lists video and pdf.
# Qwen effort is low|medium|xhigh. VOID does not document xhigh, enable_thinking, or thinking_budget.
# https://docs.qwencloud.com/developer-guides/text-generation/thinking (accessed 2026-09-22)
# https://docs.blackbit.sh/docs/void/integrations/response-anatomy (accessed 2026-09-22)
# Authored intersection: low|medium.
base_model = "alibaba/qwen3.8-max"

[[reasoning_options]]
type = "effort"
values = ["low", "medium"]

[cost]
input = 2.00
output = 6.00

[limit]
output = 128_000

[modalities]
input = ["text", "image"]
