# Pricing, output cap, and modalities from GET https://void.blackbit.sh/v1/models (accessed 2026-09-22).
# https://docs.blackbit.sh/docs/void/models/language
# Live catalog is text-only; the lab entry also advertises image input.
# VOID publishes reasoning_effort = low|medium|high and does not document
# thinking.type or max.
# https://docs.blackbit.sh/docs/void/integrations/response-anatomy (accessed 2026-09-22)
# DeepSeek native effort is low|high|max; medium is not a distinct level.
# https://api-docs.deepseek.com/guides/thinking_mode/ (accessed 2026-09-22)
# Authored intersection: low|high.
base_model = "deepseek/deepseek-v4.1-flash"
attachment = false

[[reasoning_options]]
type = "effort"
values = ["low", "high"]

[cost]
input = 0.15
output = 0.60

[limit]
output = 1_000_000

[modalities]
input = ["text"]
